<html><body style="margin:0;background:white"><div id="reader"></div><pre id="result">RUNNING</pre><script src="/node_modules/html5-qrcode/html5-qrcode.min.js"></script><script type="module">
import {createCupLabelCanvas} from '/lib/cupLabelCanvas.mjs';import{getCupLabelSize}from'/lib/printerLabelSize.mjs';
try {const results=[];for(const kind of ['ct221b','niimbot'])for(const label_size of ['40x30','50x30','50x40',...(kind==='ct221b'?['53x40']:[])]){const size=getCupLabelSize({label_size},kind);const canvas=await createCupLabelCanvas('Juja Brew & Bites\nTAKEOUT\nCocoa Sea Salt Milk Tea\nLarge\n50% sugar, Black Pearl, Cheesecake\nNote: Less ice, separate packing please\n19/11/2026 11:19|P4767798',size);const pixels=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data;for(let i=0;i<pixels.length;i+=4)if(![0,255].includes(pixels[i])||pixels[i]!==pixels[i+1]||pixels[i]!==pixels[i+2])throw Error('Non-monochrome output');const blob=await new Promise(r=>canvas.toBlob(r));const scanner=new Html5Qrcode('reader');let decoded;try{decoded=await scanner.scanFile(new File([blob],'label.png',{type:'image/png'}),false)}finally{scanner.clear()}results.push(kind+' '+label_size+' QR='+decoded);if(label_size==='53x40')document.body.append(canvas);}document.getElementById('result').textContent='PASS '+results.join('\n');}catch(e){document.getElementById('result').textContent='FAIL '+e.stack;}
</script></body></html>
